<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>תמונות – פניות מוקד</title>
<style>
  body { margin: 0; background: #F3F5F7; color: #1B2430; font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  header { position: sticky; top: 0; background: #0F4C5C; color: #fff; padding: 12px 16px; z-index: 2; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .bar { display: flex; gap: 8px; margin-top: 10px; }
  .btn { flex: 1; border: 0; border-radius: 10px; padding: 11px 10px; background: #fff; color: #0F4C5C; font: inherit; font-weight: 700; }
  .btn.alt { background: rgba(255,255,255,.16); color: #fff; }
  main { padding: 12px; }
  .note { font-size: 13px; color: #66707C; margin: 0 4px 10px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .item { background: #fff; border-radius: 12px; padding: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .item img { width: 100%; display: block; border-radius: 8px; }
  .item.wide { grid-column: 1 / -1; }
  .item .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 4px 2px; color: #66707C; }
  .item a { color: #16697A; font-weight: 700; text-decoration: none; }
  .err { background: #fff; border-radius: 12px; padding: 20px; text-align: center; color: #D64545; }
</style>
</head>
<body>
<header>
  <h1 id="title">תמונות</h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <button class="btn" id="dlAll">⬇ הורד הכל</button>
    <button class="btn alt" id="shareAll">שתף הכל</button>
  </div>
</header>
<main>
  <div class="note">התמונות נשמרות בתיקיית ההורדות ומופיעות בגלריה. שם הפונה והטלפון לא נשלחו לעמוד הזה בכלל – במקומם מופיעות נקודות מטושטשות.</div>
  <div class="grid" id="grid"></div>
</main>
<script>
'use strict';
// Everything arrives in the address after '#' (never sent to any server) from the app.
const S = 2.7, W = 400; // card drawn 400 css-px wide at 2.7x = 1080px (phone screenshot size)
const FONT = 'system-ui, "Segoe UI", Roboto, Arial, sans-serif';
const out = []; // { name, blob, url }

async function readPayload() {
  const h = location.hash.slice(1);
  const m = h.match(/^(z|j)=(.+)$/);
  if (!m) throw new Error('אין נתונים. פתח את העמוד מתוך האפליקציה.');
  const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  if (m[1] === 'j') return JSON.parse(new TextDecoder().decode(bytes));
  const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(ds).text());
}

/* ---------- drawing helpers ---------- */
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrap(g, text, maxW) {
  const lines = [];
  for (const para of String(text || '').split(/\n/)) {
    let line = '';
    for (const w of para.split(/\s+/).filter(Boolean)) {
      const t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    lines.push(line);
  }
  return lines;
}
const dots = (n) => '•'.repeat(n);

// One case card in the look of the site's phone list ("רשימת פניות").
function drawCard(c) {
  const cv = document.createElement('canvas');
  const g = cv.getContext('2d');
  const PAD = 14, CX = PAD, CW = W - PAD * 2;
  const LH = 25;

  // Rows: [label, kind, value]
  const rows = [
    ['מס\' פנייה', 'id', c.id],
    ['סיווג', 'text', c.subjectRaw || c.subject || ''],
    ['פונה', 'hidden', 8],
    ['כתובת האירוע', 'text', c.address || ''],
    ['טלפון', 'phone', ''],
    ['תאריך פתיחה', 'text', c.opened || ''],
  ];
  if (c.due) rows.push(['תאריך יעד', 'text', c.due]);
  if (c.files) rows.push(['תמונות', 'pill', `הצג תמונות (${c.files})`, '#9DB53A']);
  rows.push(['סטטוס פניה', 'pill', c.status || '', c.statusColor || '#64AFFA']);
  if (c.description) rows.push(['תיאור האירוע', 'text', c.description]);

  g.font = `700 18px ${FONT}`;
  const LBL = Math.max(...rows.map((r) => g.measureText(r[0]).width)) + 10;
  const valR = CX + CW - 14 - LBL - 14, valL = CX + 14, valW = valR - valL;
  // Measure heights first.
  const heights = rows.map(([, kind, v]) => {
    if (kind === 'text') { g.font = `17px ${FONT}`; return Math.max(1, wrap(g, v, valW).length) * LH + 22; }
    if (kind === 'pill' || kind === 'phone') return 58;
    return 47;
  });
  const btnH = 140;
  const cardH = heights.reduce((a, b) => a + b, 0) + btnH;
  const H = PAD + cardH + PAD;
  cv.width = W * S; cv.height = H * S;
  g.scale(S, S);
  g.direction = 'rtl';
  g.textBaseline = 'alphabetic';

  g.fillStyle = '#E4E8EC'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#FAF7DF'; g.fillRect(CX, PAD, CW, cardH);
  g.strokeStyle = '#D8D5C0'; g.lineWidth = 1.2; g.strokeRect(CX + .5, PAD + .5, CW - 1, cardH - 1);

  let y = PAD;
  rows.forEach(([label, kind, v, color], i) => {
    const h = heights[i];
    g.fillStyle = '#1B1B1B'; g.font = `700 18px ${FONT}`; g.textAlign = 'right';
    g.fillText(label, CX + CW - 14, y + 31);

    g.font = `17px ${FONT}`; g.fillStyle = '#333';
    if (kind === 'id') {
      g.fillText(v, valR, y + 31);
      const w = g.measureText(v).width;
      // the purple "eye" of the site
      const ex = valR - w - 22, ey = y + 25;
      g.strokeStyle = '#9C5BB5'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(ex, ey, 11, 6.5, 0, 0, Math.PI * 2); g.stroke();
      g.fillStyle = '#9C5BB5'; g.beginPath(); g.arc(ex, ey, 3.6, 0, Math.PI * 2); g.fill();
    } else if (kind === 'text') {
      wrap(g, v, valW).forEach((line, li) => g.fillText(line, valR, y + 31 + li * LH));
    } else if (kind === 'hidden') {
      g.save(); g.filter = 'blur(3.5px)'; g.fillStyle = '#444'; g.fillText(dots(v), valR, y + 31); g.restore();
    } else if (kind === 'phone') {
      const heb = 'חייג לפונה', dash = ' - ', num = '•••-•••••••';
      g.font = `17px ${FONT}`;
      const hw = g.measureText(heb).width, dw = g.measureText(dash).width, nw = g.measureText(num).width;
      const w = hw + dw + nw + 30;
      g.fillStyle = '#E2382B'; rr(g, valR - w, y + 12, w, 34, 17); g.fill();
      g.fillStyle = '#fff'; g.textAlign = 'left'; g.direction = 'ltr';
      const x0 = valR - w + 15;
      g.save(); g.filter = 'blur(3.5px)'; g.fillText(num, x0, y + 35); g.restore();
      g.fillText(dash, x0 + nw, y + 35);
      g.direction = 'rtl'; g.textAlign = 'right'; g.fillText(heb, valR - 15, y + 35);
    } else if (kind === 'pill') {
      g.font = `17px ${FONT}`;
      const w = g.measureText(v).width + 30;
      g.fillStyle = color; rr(g, valR - w, y + 12, w, 34, 17); g.fill();
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText(v, valR - w / 2, y + 35);
    }
    y += h;
    g.strokeStyle = '#E6E2CB'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(CX + 1, y); g.lineTo(CX + CW - 1, y); g.stroke();
  });

  // Buttons, like the site's: treat / map / internal chat, then "all details".
  const btn = (x, yy, w, h, color, text) => {
    g.fillStyle = color; rr(g, x, yy, w, h, 5); g.fill();
    if (text) { g.fillStyle = '#fff'; g.font = `17px ${FONT}`; g.textAlign = 'center'; g.fillText(text, x + w / 2, yy + h / 2 + 6); }
  };
  const by = y + 20, bh = 38;
  const w1 = 112, w2 = 42, w3 = 168, gap = 8;
  const total = w1 + w2 + w3 + gap * 2, bx = (W - total) / 2;
  btn(bx + w3 + w2 + gap * 2, by, w1, bh, '#B565A3', 'טיפול בפנייה');
  btn(bx + w3 + gap, by, w2, bh, '#72C1E3', '');
  // map pin
  const px = bx + w3 + gap + w2 / 2, py = by + 15;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(px, py, 6.5, Math.PI, 0); g.lineTo(px, py + 13); g.closePath(); g.fill();
  g.fillStyle = '#72C1E3'; g.beginPath(); g.arc(px, py, 2.6, 0, Math.PI * 2); g.fill();
  btn(bx, by, w3, bh, '#4472B0', 'התכתבות פנימית');
  btn((W - 110) / 2, by + bh + 14, 110, bh, '#6DBB6A', 'לכל הפרטים');
  return cv;
}

function svgToCanvas(svg, w, h) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => { const cv = document.createElement('canvas'); cv.width = w * 2; cv.height = h * 2;
      const g = cv.getContext('2d'); g.scale(2, 2); g.drawImage(img, 0, 0); ok(cv); };
    img.onerror = () => bad(new Error('יצירת תמונת הגרף נכשלה'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
const toBlob = (cv) => new Promise((r) => cv.toBlob(r, 'image/png'));

function addItem(name, blob, label, wide) {
  const url = URL.createObjectURL(blob);
  out.push({ name, blob, url });
  const d = document.createElement('div');
  d.className = 'item' + (wide ? ' wide' : '');
  d.innerHTML = `<img src="${url}" alt=""><div class="row"><span></span><a href="${url}" download="${name}">⬇ הורד</a></div>`;
  d.querySelector('span').textContent = label;
  document.getElementById('grid').appendChild(d);
}

async function main() {
  let p;
  try { p = await readPayload(); } catch (e) {
    document.getElementById('grid').innerHTML = `<div class="err"></div>`;
    document.querySelector('.err').textContent = e.message || 'שגיאה';
    return;
  }
  document.getElementById('title').textContent = p.title || 'תמונות';
  document.getElementById('sub').textContent = `${(p.cases || []).length} פניות${p.chart ? ' + גרף' : ''}`;
  const tag = (p.label || '').replace(/[^0-9.\-]/g, '');
  if (p.chart) {
    const cv = await svgToCanvas(p.chart.svg, p.chart.w, p.chart.h);
    addItem(`סיכום_שבועי_${tag}.png`, await toBlob(cv), 'גרף שבועי', true);
  }
  for (const c of p.cases || []) {
    addItem(`פנייה_${c.id}_${tag}.png`, await toBlob(drawCard(c)), `פנייה ${c.id}`);
  }
}

document.getElementById('dlAll').onclick = async () => {
  for (const f of out) {
    const a = document.createElement('a'); a.href = f.url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise((r) => setTimeout(r, 500));
  }
};
document.getElementById('shareAll').onclick = async () => {
  const files = out.map((f) => new File([f.blob], f.name, { type: 'image/png' }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files, title: document.getElementById('title').textContent }); } catch (e) {}
  } else alert('הדפדפן לא תומך בשיתוף קבצים – השתמש ב"הורד הכל"');
};
main();
</script>
</body>
</html>
